<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CliRelay 管理后台</title>
    <link rel="icon" type="image/svg+xml" href="/manage/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/manage/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/manage/favicon-192.png" />
    <link rel="apple-touch-icon" href="/manage/apple-touch-icon.png" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111114" media="(prefers-color-scheme: dark)" />
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var apply = function (isDark) {
            root.classList.toggle("dark", isDark);
            root.style.colorScheme = isDark ? "dark" : "light";
            if (isDark) {
              root.setAttribute("data-theme", "dark");
            } else {
              root.removeAttribute("data-theme");
            }
          };
          // Windows 用系统字体与 1.0 根字号（见 styles/index.css 的 data-os 说明）。
          // 只认平台字段开头的 Win（Win32 / Windows），不能宽松匹配——"darwin" 里也有 win。
          // 先读 navigator.platform：UA 字符串常被伪装（Playwright 的 Desktop Chrome 设备就是
          // Windows UA），Chrome 会照着伪装的 UA 推导 userAgentData.platform，只有
          // navigator.platform 始终是真实系统；它为空时才退回 userAgentData。
          var platform =
            navigator.platform || (navigator.userAgentData && navigator.userAgentData.platform) || "";
          if (/^win/i.test(platform)) {
            root.setAttribute("data-os", "windows");
          }
          var t = localStorage.getItem("code-proxy-admin-theme");
          if (t === "dark") {
            apply(true);
          } else if (t === "light") {
            apply(false);
          } else {
            if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
              apply(true);
            }
          }
        } catch (e) {}
      })();
    </script>
    <style>
      :root {
        --pl-bg: #ffffff;
        --pl-ring-track: rgba(13, 13, 13, 0.1);
        --pl-ring: #111113;
        --pl-text: #76767d;
      }
      .dark {
        --pl-bg: #111114;
        --pl-ring-track: rgba(255, 255, 255, 0.12);
        --pl-ring: #f2f2f4;
        --pl-text: #86868f;
      }
      body {
        margin: 0;
        background-color: var(--pl-bg);
        transition: background-color 0.3s ease;
      }
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        background-color: var(--pl-bg);
        opacity: 1;
        transition: opacity 0.4s ease, visibility 0.4s ease;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", system-ui, sans-serif;
      }
      #app-loader.fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .pl-loader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        animation: pl-content-in 0.36s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      .pl-ring {
        width: 40px;
        height: 40px;
        box-sizing: border-box;
        border-radius: 50%;
        border: 2px solid var(--pl-ring-track);
        border-top-color: var(--pl-ring);
        animation: pl-spin 0.9s linear infinite;
        margin-bottom: 18px;
      }
      .pl-text {
        font-size: 13px;
        font-weight: 500;
        color: var(--pl-text);
        user-select: none;
      }
      @keyframes pl-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes pl-content-in {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0);    }
      }
    </style>
  </head>
  <body>
    <div id="app-loader" aria-label="Loading">
      <div class="pl-loader-content">
        <div class="pl-ring"></div>
        <span class="pl-text">CliRelay</span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
