<!doctype html>
<html lang="zh-CN" data-palette="colorful" data-icons="colorful" data-bars="semantic">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 锁死全站 CSS Cascade Layers 顺序：确保任意异步或拆分出来的 Satin CSS 永远高于 Tailwind base preflight、低于 utilities。 -->
    <style>@layer properties, theme, base, satin, components, utilities;</style>
    <title>CliRelay · 一个入口，接入全部模型能力</title>
    <meta
      name="description"
      content="CliRelay 是 OpenAI 兼容的统一模型网关：一个 API Key 调度 Claude、Gemini、GPT、Grok 等模型，内置用量统计、请求日志、配额限额与账号池。"
    />
    <link rel="icon" type="image/svg+xml" href="/manage/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/manage/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/manage/favicon-192.png" />
    <link rel="apple-touch-icon" href="/manage/apple-touch-icon.png" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111114" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CliRelay" />
    <meta property="og:title" content="CliRelay · 一个入口，接入全部模型能力" />
    <meta
      property="og:description"
      content="OpenAI 兼容的统一模型网关 · 用量可观测 · 请求日志 · 配额与账号池"
    />
    <meta property="og:image" content="/manage/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- 阻塞渲染的主题恢复脚本：在 body 绘制前读取 localStorage 并应用暗色模式 -->
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var apply = function (isDark) {
            root.classList.toggle("dark", isDark);
            root.style.colorScheme = isDark ? "dark" : "light";
            root.setAttribute("data-theme", isDark ? "dark" : "light");
          };
          // Windows 用系统字体与 1.0 根字号（见 styles/index.css 的 data-os 说明）。
          // 只认平台字段开头的 Win（Win32 / Windows），不能宽松匹配——"darwin" 里也有 win。
          // 先读 navigator.platform：UA 字符串常被伪装（Playwright 的 Desktop Chrome 设备就是
          // Windows UA），Chrome 会照着伪装的 UA 推导 userAgentData.platform，只有
          // navigator.platform 始终是真实系统；它为空时才退回 userAgentData。
          var platform =
            navigator.platform || (navigator.userAgentData && navigator.userAgentData.platform) || "";
          if (/^win/i.test(platform)) {
            root.setAttribute("data-os", "windows");
          }
          // 外观设置（系统设置 → 外观）：风格开关与自定义变量要在首屏绘制前写上，否则会先闪一帧
          // 默认的多彩样式。这里只搬运应用存下来的计算结果（attrs / vars），不重复颜色计算；
          // 变量名只认外观会写的那几类，值只认它会写的三种形状（#rrggbb、rgb(...)、数字）——
          // 存储被篡改也写不进别的东西，比如进度条 background 里会去加载的 url()。
          // 读不到时保留 <html> 上的默认值。
          try {
            var appearance = JSON.parse(localStorage.getItem("code-proxy-admin-appearance") || "null");
            if (appearance && appearance.version === 1) {
              var attrs = appearance.attrs || {};
              var names = ["palette", "icons", "bars"];
              for (var i = 0; i < names.length; i++) {
                if (typeof attrs[names[i]] === "string" && /^[a-z]+$/.test(attrs[names[i]])) {
                  root.setAttribute("data-" + names[i], attrs[names[i]]);
                }
              }
              var vars = appearance.vars || {};
              for (var name in vars) {
                if (
                  Object.prototype.hasOwnProperty.call(vars, name) &&
                  /^--(cp-pref-[a-z0-9-]+|color-(emerald|green|amber|rose|red)-\d{2,3})$/.test(name) &&
                  typeof vars[name] === "string" &&
                  /^(#[0-9a-f]{6}|rgb\([0-9 ./]+\)|-?[0-9.]+)$/i.test(vars[name])
                ) {
                  root.style.setProperty(name, vars[name]);
                }
              }
            }
          } catch (appearanceError) {}
          var t = localStorage.getItem("code-proxy-admin-theme");
          if (t === "dark") {
            apply(true);
          } else if (t === "light") {
            apply(false);
          } else {
            // 跟随系统偏好并显式写入 data-theme，确保首屏与后续主题切换状态一致
            apply(Boolean(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches));
          }
        } catch (e) {}
      })();
    </script>
    <style>
      :root {
        --pl-bg: #f8f8fa;
        --pl-dot: #1d1d1f;
        --pl-text: #86868b;
      }
      .dark {
        --pl-bg: #0b0b0e;
        --pl-dot: #f5f5f7;
        --pl-text: #86868b;
      }
      body {
        margin: 0;
        background-color: var(--pl-bg);
        transition: background-color 0.3s ease;
      }
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        background-color: var(--pl-bg);
        opacity: 1;
        transition: opacity 0.32s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.32s ease;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", system-ui, sans-serif;
      }
      #app-loader.fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .pl-loader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        animation: pl-content-in 0.32s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      /* Satin 3×3 对角波纹点阵几何加载器 */
      .pl-matrix {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 3px;
        width: 24px;
        height: 24px;
        padding: 1.5px;
        box-sizing: border-box;
      }
      .pl-matrix i {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: var(--pl-dot);
        animation: pl-mat 1.15s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }
      .pl-matrix i:nth-child(1) { animation-delay: 0s; }
      .pl-matrix i:nth-child(2), .pl-matrix i:nth-child(4) { animation-delay: 0.11s; }
      .pl-matrix i:nth-child(3), .pl-matrix i:nth-child(5), .pl-matrix i:nth-child(7) { animation-delay: 0.22s; }
      .pl-matrix i:nth-child(6), .pl-matrix i:nth-child(8) { animation-delay: 0.33s; }
      .pl-matrix i:nth-child(9) { animation-delay: 0.44s; }
      .pl-text {
        font-size: 13px;
        font-weight: 500;
        color: var(--pl-text);
        user-select: none;
      }
      @keyframes pl-mat {
        0%, 100% { transform: scale(0.42); opacity: 0.22; }
        38% { transform: scale(1); opacity: 1; }
      }
      @keyframes pl-content-in {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0);    }
      }
    </style>
  </head>

  <body>
    <div id="app-loader" aria-label="Loading">
      <div class="pl-loader-content">
        <span class="pl-matrix" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
        <span class="pl-text">CliRelay</span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/manage-entry.tsx"></script>
  </body>
</html>
