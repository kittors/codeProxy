name: PR Test Build

on:
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-test-build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality_build_e2e:
    name: quality-build-e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.2

      - name: Cache Bun downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Design checks
        run: bun run design:check

      - name: Import boundaries
        run: bun run boundary:imports

      - name: Build
        run: bun run build

      - name: Bundle diff
        run: bun run bundle:diff

      - name: Install Chromium
        run: bunx playwright install chromium

      - name: Critical E2E
        run: bunx playwright test e2e/multi-tenant-auth.spec.ts e2e/login-lifecycle.spec.ts --grep '@critical'

  vitest:
    name: vitest-${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1/2
          - 2/2
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.2

      - name: Cache Bun downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Vitest shard ${{ matrix.shard }}
        run: bun run test:ci -- --shard=${{ matrix.shard }}

  test-build:
    name: test-build
    runs-on: ubuntu-latest
    if: always()
    needs:
      - quality_build_e2e
      - vitest
    steps:
      - name: Verify required jobs
        env:
          QUALITY_BUILD_E2E_RESULT: ${{ needs.quality_build_e2e.result }}
          VITEST_RESULT: ${{ needs.vitest.result }}
        run: |
          if [[ "$QUALITY_BUILD_E2E_RESULT" != "success" || "$VITEST_RESULT" != "success" ]]; then
            echo "quality-build-e2e=$QUALITY_BUILD_E2E_RESULT"
            echo "vitest=$VITEST_RESULT"
            exit 1
          fi
