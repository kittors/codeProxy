name: Deploy Frontend

on:
  push:
    branches: [dev]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      force:
        description: 'Bypass required-check gate (emergency only)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read
  checks: read

concurrency:
  group: deploy-relay-frontend
  cancel-in-progress: false

env:
  PANEL_RELEASE: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
  PUBLIC_PANEL_BASE: ${{ vars.RELAY_PUBLIC_PANEL_BASE || 'https://relay.07230805.xyz' }}
  # CliRelay serves this file from the live panel directory (/manage/*filepath),
  # so what a node returns is the release its relay-panel symlink points at.
  PANEL_VERSION_PATH: ${{ vars.RELAY_PANEL_VERSION_PATH || '/manage/version.txt' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Branch protection on dev requires green PR checks before merge.
      # Merge commits do not re-run pr-test-build, so we do not re-query check-runs here.
      - name: Record deploy mode
        env:
          FORCE_DEPLOY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force || 'false' }}
          DEPLOY_NODES: ${{ vars.RELAY_DEPLOY_NODES || '["default"]' }}
        run: |
          set -euo pipefail
          # Node names become secret-name suffixes (SERVER_HOST_<node>), and
          # GitHub compares secret names case-insensitively.
          if ! printf '%s' "${DEPLOY_NODES}" | jq -e '
              type == "array" and length > 0
              and all(.[]; type == "string" and test("^[A-Za-z0-9_]+$"))
              and ((map(ascii_downcase) | unique | length) == length)' > /dev/null; then
            echo "::error::RELAY_DEPLOY_NODES must be a non-empty JSON array of distinct names made of letters, digits and underscores, such as [\"n43\",\"n156\"]; got: ${DEPLOY_NODES}"
            exit 1
          fi
          echo "Rolling deploy order: $(printf '%s' "${DEPLOY_NODES}" | jq -r 'join(" -> ")')"
          if [ "${FORCE_DEPLOY}" = "true" ]; then
            echo "::warning::Forced frontend deploy via workflow_dispatch"
            echo "DEPLOY_MODE=forced" >> "$GITHUB_ENV"
          else
            echo "DEPLOY_MODE=deploying" >> "$GITHUB_ENV"
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compute UI version
        id: version
        run: |
          set -euo pipefail
          SHORT_SHA="$(git rev-parse --short HEAD)"
          VITE_APP_VERSION="${{ github.ref_name }}-${SHORT_SHA}"
          echo "VITE_APP_VERSION=${VITE_APP_VERSION}" >> "$GITHUB_ENV"
          echo "app_version=${VITE_APP_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build production bundle
        run: bun run build

      - name: Write deployment version marker
        run: |
          printf '%s\n' "${VITE_APP_VERSION}" > dist/version.txt

      # Every node gets this exact bundle; nothing is rebuilt per node.
      - name: Package release
        run: tar -C dist -czf panel-release.tgz .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: panel-release
          path: panel-release.tgz
          if-no-files-found: error
          retention-days: 7

      - name: Write job summary
        if: always()
        env:
          DEPLOY_NODES: ${{ vars.RELAY_DEPLOY_NODES || '["default"]' }}
        run: |
          {
            echo "## Frontend deploy"
            echo "- mode: \`${DEPLOY_MODE:-unknown}\`"
            echo "- sha: \`${{ github.sha }}\`"
            echo "- version: \`${VITE_APP_VERSION:-n/a}\`"
            echo "- release: \`${PANEL_RELEASE}\`"
            echo "- nodes, in rollout order: \`${DEPLOY_NODES}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          # Docker image builds are triggered only by CliRelay backend deploy (single source of truth).

  # Read-only checks on every node before the first one is touched, so an
  # unreachable node stops the run while every node still serves the previous
  # release, instead of halfway through the rollout.
  preflight:
    name: Preflight ${{ matrix.node }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        node: ${{ fromJSON(vars.RELAY_DEPLOY_NODES || '["default"]') }}
    env:
      NODE: ${{ matrix.node }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Each node has its own SERVER_HOST_<node> and friends. The node named
      # "default" uses the original unsuffixed secrets, so a single-node setup
      # needs no new configuration. Only the key and known_hosts may fall back
      # to the shared secrets: a missing host must never resolve to another node.
      - name: Configure SSH for node
        env:
          NODE_HOST: ${{ matrix.node == 'default' && secrets.SERVER_HOST || secrets[format('SERVER_HOST_{0}', matrix.node)] }}
          NODE_PORT: ${{ matrix.node == 'default' && secrets.SERVER_PORT || secrets[format('SERVER_PORT_{0}', matrix.node)] }}
          NODE_SSH_KEY: ${{ secrets[format('SSH_PRIVATE_KEY_{0}', matrix.node)] || secrets.SSH_PRIVATE_KEY }}
          NODE_KNOWN_HOSTS: ${{ secrets[format('DEPLOY_SSH_KNOWN_HOSTS_{0}', matrix.node)] || secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          NODE_SMOKE_IP: ${{ matrix.node == 'default' && (secrets.SMOKE_IP || vars.RELAY_SMOKE_IP) || secrets[format('SMOKE_IP_{0}', matrix.node)] || vars[format('RELAY_SMOKE_IP_{0}', matrix.node)] }}
          NODE_JUMP: ${{ secrets[format('SSH_JUMP_{0}', matrix.node)] }}
        run: ./.github/scripts/node-ssh.sh

      - name: Check node accepts the release
        run: |
          set -euo pipefail
          if ! ssh deploy-target 'test -d /home/web/html && test -w /home/web/html && { test ! -e /home/web/html/relay-panel-releases || test -w /home/web/html/relay-panel-releases; }'; then
            echo "::error::node ${NODE}: deploy cannot log in, or cannot write /home/web/html and its relay-panel-releases directory"
            exit 1
          fi

  deploy:
    name: Deploy ${{ matrix.node }}
    needs: [build, preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # One node at a time, in RELAY_DEPLOY_NODES order. A node whose smoke fails
      # is rolled back on its own and the remaining nodes are not touched.
      max-parallel: 1
      fail-fast: true
      matrix:
        node: ${{ fromJSON(vars.RELAY_DEPLOY_NODES || '["default"]') }}
    env:
      NODE: ${{ matrix.node }}
      VITE_APP_VERSION: ${{ needs.build.outputs.app_version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: panel-release

      # Native ssh only. Remote user is deploy (not root). No docker required on deploy user.
      - name: Configure SSH for node
        env:
          NODE_HOST: ${{ matrix.node == 'default' && secrets.SERVER_HOST || secrets[format('SERVER_HOST_{0}', matrix.node)] }}
          NODE_PORT: ${{ matrix.node == 'default' && secrets.SERVER_PORT || secrets[format('SERVER_PORT_{0}', matrix.node)] }}
          NODE_SSH_KEY: ${{ secrets[format('SSH_PRIVATE_KEY_{0}', matrix.node)] || secrets.SSH_PRIVATE_KEY }}
          NODE_KNOWN_HOSTS: ${{ secrets[format('DEPLOY_SSH_KNOWN_HOSTS_{0}', matrix.node)] || secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          NODE_SMOKE_IP: ${{ matrix.node == 'default' && (secrets.SMOKE_IP || vars.RELAY_SMOKE_IP) || secrets[format('SMOKE_IP_{0}', matrix.node)] || vars[format('RELAY_SMOKE_IP_{0}', matrix.node)] }}
          NODE_JUMP: ${{ secrets[format('SSH_JUMP_{0}', matrix.node)] }}
        run: ./.github/scripts/node-ssh.sh

      - name: Upload static assets to release directory
        run: |
          set -euo pipefail
          release_dir="/home/web/html/relay-panel-releases/${PANEL_RELEASE}"
          ssh deploy-target "mkdir -p $(printf %q "${release_dir}")"
          # Stream the bundle over ssh; no third-party Action, no remote rsync dependency.
          ssh deploy-target "tar -C $(printf %q "${release_dir}") -xzf -" < panel-release.tgz

      - name: Activate and verify frontend release
        id: activate
        run: |
          set -euo pipefail
          ssh deploy-target \
            "PANEL_RELEASE=$(printf %q "${PANEL_RELEASE}") VITE_APP_VERSION=$(printf %q "${VITE_APP_VERSION}") bash -s" <<'EOF' | tee activate.log
          set -euo pipefail
          releases_dir="/home/web/html/relay-panel-releases"
          release_dir="${releases_dir}/${PANEL_RELEASE}"
          live_path="/home/web/html/relay-panel"
          candidate_link="/home/web/html/.relay-panel-${PANEL_RELEASE}"
          previous_target=""
          if [ -L "${live_path}" ]; then
            previous_target="$(readlink "${live_path}")"
          fi

          test -f "${release_dir}/manage.html"
          test -f "${release_dir}/version.txt"
          test "$(cat "${release_dir}/version.txt")" = "${VITE_APP_VERSION}"
          if ! grep -R --include='*.js' -q "/channel-groups" "${release_dir}/assets"; then
            echo "channel-groups route was not found in uploaded frontend assets"
            exit 1
          fi

          rm -f "${candidate_link}"
          ln -s "relay-panel-releases/${PANEL_RELEASE}" "${candidate_link}"
          if [ -L "${live_path}" ]; then
            mv -Tf "${candidate_link}" "${live_path}"
          elif [ -d "${live_path}" ]; then
            legacy_path="${live_path}.legacy-$(date +%s)"
            mv "${live_path}" "${legacy_path}"
            if ! mv -T "${candidate_link}" "${live_path}"; then
              mv "${legacy_path}" "${live_path}"
              exit 1
            fi
            rm -rf "${legacy_path}"
          elif [ ! -e "${live_path}" ]; then
            mv -T "${candidate_link}" "${live_path}"
          else
            echo "Unsupported frontend live path: ${live_path}"
            exit 1
          fi

          # Verify via host bind-mount path (same files nginx serves). deploy has no docker.
          if ! test "$(cat "${live_path}/version.txt")" = "${VITE_APP_VERSION}" || ! test -f "${live_path}/manage.html"; then
            echo "post-switch host verification failed; rolling back symlink" >&2
            if [ -n "${previous_target}" ]; then
              ln -sfn "${previous_target}" "${live_path}"
            fi
            exit 1
          fi

          # Keep last 5 successful releases and anything newer than 7 days.
          ls -1dt "${releases_dir}"/*/ 2>/dev/null | tail -n +6 | while read -r old; do
            # skip if modified within 7 days
            if find "$old" -maxdepth 0 -mtime -7 | grep -q .; then
              continue
            fi
            case "$old" in
              "${release_dir}/") continue ;;
            esac
            case "$old" in
              "/home/web/html/${previous_target}/") continue ;;
            esac
            rm -rf -- "$old"
          done
          echo "Frontend ${VITE_APP_VERSION} deployed successfully from ${release_dir}."
          echo "PREVIOUS_TARGET=${previous_target}"
          EOF
          # The release this node served before, so a failed smoke can put
          # exactly that one back rather than the newest leftover directory.
          previous="$(sed -n 's/^PREVIOUS_TARGET=//p' activate.log | tail -n 1)"
          case "${previous}" in
            *[!A-Za-z0-9._/-]*)
              echo "::error::node ${NODE}: unexpected previous release '${previous}'"
              exit 1
              ;;
          esac
          echo "previous_target=${previous}" >> "$GITHUB_OUTPUT"

      # Through DNS the smoke could land on another node, which would say nothing
      # about this one. It is pinned to this node's public address and compares
      # version.txt with this build; on failure only this node is rolled back, and
      # fail-fast keeps the remaining nodes on the previous release.
      - name: Verify release through this node
        env:
          PREVIOUS_TARGET: ${{ steps.activate.outputs.previous_target }}
        run: |
          set -euo pipefail
          base="${PUBLIC_PANEL_BASE%/}"
          authority="${base#https://}"
          authority="${authority%%/*}"
          host="${authority%%:*}"
          port=443
          case "${authority}" in
            *:*) port="${authority##*:}" ;;
          esac
          case "${NODE_SMOKE_IP}" in
            *:*) addr="[${NODE_SMOKE_IP}]" ;;
            *) addr="${NODE_SMOKE_IP}" ;;
          esac
          pin=(--resolve "${host}:${port}:${addr}")

          ok=0
          seen="no answer"
          deadline=$(( $(date +%s) + 60 ))
          while :; do
            page=000
            for path in "/manage/" "/manage/index.html" "/manage.html"; do
              page="$(curl -sS -o /dev/null -w '%{http_code}' -L --max-time 20 "${pin[@]}" "${base}${path}" || true)"
              case "${page}" in
                200 | 304) break ;;
              esac
            done
            served="$(curl -fsS --max-time 20 "${pin[@]}" "${base}${PANEL_VERSION_PATH}" 2>/dev/null | tr -d '\r\n' || true)"
            if { [ "${page}" = 200 ] || [ "${page}" = 304 ]; } && [ "${served}" = "${VITE_APP_VERSION}" ]; then
              ok=1
              break
            fi
            seen="panel HTTP ${page}, ${PANEL_VERSION_PATH} '${served:-<none>}'"
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              break
            fi
            sleep 3
          done
          if [ "${ok}" -eq 1 ]; then
            echo "node ${NODE}: ${base} via ${NODE_SMOKE_IP} serves ${VITE_APP_VERSION}"
            exit 0
          fi

          echo "::error::node ${NODE}: ${seen}, expected ${VITE_APP_VERSION}; rolling this node back, later nodes keep the previous release"
          ssh deploy-target \
            "PANEL_RELEASE=$(printf %q "${PANEL_RELEASE}") PREVIOUS_TARGET=$(printf %q "${PREVIOUS_TARGET}") bash -s" <<'EOF'
          set -euo pipefail
          live_path="/home/web/html/relay-panel"
          if [ -z "${PREVIOUS_TARGET}" ]; then
            echo "no previous release was live on this node; leaving ${PANEL_RELEASE} in place" >&2
            exit 1
          fi
          case "${PREVIOUS_TARGET}" in
            /*) target_dir="${PREVIOUS_TARGET}" ;;
            *) target_dir="/home/web/html/${PREVIOUS_TARGET}" ;;
          esac
          if [ ! -f "${target_dir}/manage.html" ]; then
            echo "previous release ${PREVIOUS_TARGET} is gone; leaving ${PANEL_RELEASE} in place" >&2
            exit 1
          fi
          rollback_link="/home/web/html/.relay-panel-rollback-${PANEL_RELEASE}"
          rm -f "${rollback_link}"
          ln -s "${PREVIOUS_TARGET}" "${rollback_link}"
          mv -Tf "${rollback_link}" "${live_path}"
          echo "rolled ${live_path} back to ${PREVIOUS_TARGET}"
          EOF
          exit 1

      - name: Write job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "### Node \`${NODE}\`"
            echo "- version: \`${VITE_APP_VERSION}\`"
            echo "- release: \`${PANEL_RELEASE}\`"
            echo "- smoke pinned to: \`${NODE_SMOKE_IP:-n/a}\`"
            echo "- result: \`${JOB_STATUS}\`"
          } >> "$GITHUB_STEP_SUMMARY"
