name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned so release artifacts are built by a known toolchain, and so
          # local ci-pr.sh runs predict CI. Keep in sync with pr-test-build.yml.
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compute UI version
        run: |
          set -euo pipefail
          # Tag name like vX.Y.Z
          echo "VITE_APP_VERSION=${{ github.ref_name }}" >> "$GITHUB_ENV"

      - name: Build production bundle
        run: bun run build

      - name: Package panel-dist.zip
        run: cd dist && zip -r ../panel-dist.zip manage.html assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            panel-dist.zip
            dist/management.html
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
